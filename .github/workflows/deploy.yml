name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Ship only what the browser needs; the tests and their manifest are not part of
      # the site. rsync so the exclusion list stays readable.
      - run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'test' \
                --exclude 'node_modules' --exclude 'package*.json' --exclude '_site' ./ _site/
          ls _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4

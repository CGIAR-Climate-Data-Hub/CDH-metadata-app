name: Test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      # The suites read the published schema over the network; the spec repo is not
      # checked out here, so the drift check is a local-only tool (it reports that
      # it cannot compare rather than failing).
      - run: npm test
